<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gradius Prototype</title>
  <style>
    body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 1px solid #333; }
  </style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// 自機データ
const player = {
  x: 50, y: 240, speed: 3,
  history: [], // オプション追従用座標履歴
  powerIndex: 0 // 0:なし, 1:SPEED, 2:MISSILE, 3:DOUBLE, 4:LASER, 5:OPTION, 6:?
};

const bullets = [];
const options = []; // オプション数 (最大4)
const gaugeNames = ["SPEED", "MISSILE", "DOUBLE", "LASER", "OPTION", "?"];

function update() {
  // 移動
  if (keys['ArrowUp'] && player.y > 10) player.y -= player.speed;
  if (keys['ArrowDown'] && player.y < 420) player.y += player.speed;
  if (keys['ArrowLeft'] && player.x > 10) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < 600) player.x += player.speed;

  // 座標履歴の保存（最新を先頭に）
  player.history.unshift({ x: player.x, y: player.y });
  if (player.history.length > 200) player.history.pop();

  // ショット発射 (Space)
  if (keys['Space'] && !player.shotCooldown) {
    bullets.push({ x: player.x + 20, y: player.y + 6, vx: 8 });
    // オプションからも発射
    options.forEach(opt => {
      bullets.push({ x: opt.x + 10, y: opt.y + 4, vx: 8 });
    });
    player.shotCooldown = 10;
  }
  if (player.shotCooldown > 0) player.shotCooldown--;

  // パワーアップ発動 (KeyX)
  if (keys['KeyX'] && !player.powerCooldown && player.powerIndex > 0) {
    applyPowerUp(player.powerIndex);
    player.powerIndex = 0;
    player.powerCooldown = 15;
  }
  if (player.powerCooldown > 0) player.powerCooldown--;

  // オプション位置更新（例: 15フレーム間隔で追従）
  options.forEach((opt, i) => {
    const delay = (i + 1) * 15;
    if (player.history[delay]) {
      opt.x = player.history[delay].x;
      opt.y = player.history[delay].y;
    }
  });

  // 弾更新
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    if (bullets[i].x > 640) bullets.splice(i, 1);
  }
}

function applyPowerUp(idx) {
  if (idx === 1) player.speed += 1;
  if (idx === 5 && options.length < 4) options.push({ x: player.x, y: player.y });
}

function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, 640, 480);

  // 自機描画 (ビックバイパー風の三角)
  ctx.fillStyle = '#4af';
  ctx.beginPath();
  ctx.moveTo(player.x + 20, player.y + 7);
  ctx.lineTo(player.x, player.y);
  ctx.lineTo(player.x, player.y + 14);
  ctx.fill();

  // オプション描画
  ctx.fillStyle = '#fa0';
  options.forEach(opt => {
    ctx.beginPath();
    ctx.arc(opt.x + 8, opt.y + 7, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 弾描画
  ctx.fillStyle = '#ff0';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, 8, 3));

  // パワーアップメーターUI
  const gaugeW = 80;
  const startX = (640 - (gaugeW * 6)) / 2;
  gaugeNames.forEach((name, i) => {
    const isSelected = (player.powerIndex === i + 1);
    ctx.fillStyle = isSelected ? '#ffcc00' : '#112233';
    ctx.fillRect(startX + i * gaugeW, 445, gaugeW - 4, 25);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(startX + i * gaugeW, 445, gaugeW - 4, 25);
    ctx.fillStyle = isSelected ? '#000' : '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(name, startX + i * gaugeW + 8, 461);
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
